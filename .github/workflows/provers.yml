name: Provers

# Rebuild the WebAssembly provers when their build changes, and check that the
# committed binaries are the ones the build gives.
on:
  push:
    paths: [provers/build/**, provers/*.wasm]
  pull_request:
    paths: [provers/build/**, provers/*.wasm]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: provers/build/build.sh
      - run: git diff --exit-code provers/*.wasm
